<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actor Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .actor-card{
            width: 100%;
            max-width: 600px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
        }

        .card-header{
            background: linear-gradient(135deg, #198754, #20c997);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .card-header h1{
            margin: 0;
            font-size: 2rem;
            font-weight: bold;
        }

        .card-body{
            padding: 40px;
        }

        .info-box{
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .label{
            font-weight: bold;
            color: #555;
        }

        .value{
            font-size: 18px;
            color: #111;
        }

    </style>
</head>

<body>

    <div class="card actor-card">

        <div class="card-header">
            <h1>🎭 Actor Details</h1>
        </div>

        <div class="card-body">

            {% if row %}

                <div class="info-box">

                    <div class="label">
                        Actor ID
                    </div>

                    <div class="value">
                        {{ row[0] }}
                    </div>

                </div>

                <div class="info-box">

                    <div class="label">
                        First Name
                    </div>

                    <div class="value">
                        {{ row[1] }}
                    </div>

                </div>

                <div class="info-box">

                    <div class="label">
                        Last Name
                    </div>

                    <div class="value">
                        {{ row[2] }}
                    </div>

                </div>

                <div class="text-center mt-4">

                    <a href="/"
                       class="btn btn-primary px-4">

                        🔍 Search Again

                    </a>

                </div>

            {% else %}

                <div class="alert alert-danger text-center">

                    <h4>No Actor Found</h4>

                </div>

                <div class="text-center mt-4">

                    <a href="/"
                       class="btn btn-secondary">

                        Back

                    </a>

                </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
