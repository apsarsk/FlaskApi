<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Actor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Update Actor</h2>

        <form id="updateForm">

            <div class="mb-3">
                <label class="form-label">Actor ID</label>
                <input
                    type="number"
                    id="actor_id"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input
                    type="text"
                    id="last_name"
                    class="form-control"
                    required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">
                    Update Actor
                </button>
            </div>

        </form>

        <div id="result" class="mt-3 text-center fw-bold"></div>

    </div>

</div>

<script>

document.getElementById("updateForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const actorId = document.getElementById("actor_id").value;

    const data = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value
    };

    const response = await fetch(`/updateActor/${actorId}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    });

    const result = await response.json();

    document.getElementById("result").innerHTML = result.message;

});

</script>

</body>
</html>
