<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Actor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-card{
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card-header{
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .card-header h1{
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }

        .card-body{
            padding: 40px;
        }

        .form-control{
            height: 50px;
            border-radius: 12px;
        }

        .btn-search{
            width: 100%;
            height: 50px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div class="card search-card">

        <div class="card-header">
            <h1>🎬 Actor Search</h1>
        </div>

        <div class="card-body">

            <form action="/getActorById" method="GET">

                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Enter Actor ID
                    </label>

                    <input type="number"
                           name="id"
                           class="form-control"
                           placeholder="Example: 5"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-search">

                    Search Actor

                </button>

            </form>

        </div>

    </div>

</body>
</html>
