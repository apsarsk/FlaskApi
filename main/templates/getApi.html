<!DOCTYPE html>
<html>
<head>
    <title>User Table</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Actors Data</h2>

    <!-- Table -->
    <table class="table table-bordered table-striped table-hover shadow">

        <thead class="table-dark">
            <tr>
                <th>actor_id</th>
                <th>firstname</th>
                <th>lastname</th>
            </tr>
        </thead>

        <tbody>

            {% for row in rows %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
            </tr>
            {% endfor %}

        </tbody>

    </table>

    <!-- Pagination -->
    <nav>
        <ul class="pagination justify-content-center">

            <!-- Previous Button -->
            {% if page > 1 %}
            <li class="page-item">
                <a class="page-link"
                   href="/users?page={{ page - 1 }}">
                   Previous
                </a>
            </li>
            {% endif %}

            <!-- Page Numbers -->
            {% for p in range(1, total_pages + 1) %}
            <li class="page-item {% if p == page %}active{% endif %}">
                <a class="page-link"
                   href="/getApi?page={{ p }}">
                   {{ p }}
                </a>
            </li>
            {% endfor %}

            <!-- Next Button -->
            {% if page < total_pages %}
            <li class="page-item">
                <a class="page-link"
                   href="/users?page={{ page + 1 }}">
                   Next
                </a>
            </li>
            {% endif %}

        </ul>
    </nav>

</div>

</body>
</html>
